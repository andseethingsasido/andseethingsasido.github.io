<!-- 1. 结构层 (HTML) -->
<footer id="footer">
    <!-- 居中且宽度 800px 的图片区域 -->
    <div class="footer-photo-container">
        <img src="{{ '/images/dao.png' | relative_url }}" alt="DAO" class="footer-photo">
    </div>

    <!-- 底部导航菜单 -->
    <nav class="footer-nav">
        <a href="{{ '/' | relative_url }}" class="footer-link">HOME</a>
        <span class="footer-divider">/</span>
        <a href="https://andseethingsasido.github.io/and666/" class="footer-link">SHOP</a>

    <div class="footer-copyright">
        &copy; AND SEETHINGS AS I DO. ALL RIGHTS RESERVED.
    </div>
</footer>

<!-- 2. 样式层 (CSS) -->
<style>
    #footer {
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 40px 0 60px 0;
        background: #000;
        box-sizing: border-box;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
        margin-top: auto;
    }

    /* 底部图片居中与宽度控制 */
    .footer-photo-container {
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        margin-bottom: 30px;
    }

    .footer-photo {
        width: 800px;
        max-width: 90vw; /* 移动端窄屏时自动缩放，防止溢出屏幕 */
        height: auto;
        display: block;
        object-fit: contain;
        user-select: none;
        -webkit-user-drag: none;
    }

    /* 底部导航链接样式 */
    .footer-nav {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        margin-bottom: 20px;
        flex-wrap: wrap;
    }

    .footer-link {
        font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.25em;
        color: #888;
        text-decoration: none;
        text-transform: uppercase;
        transition: color 0.3s ease;
    }

    .footer-link:hover {
        color: #fff;
    }

    .footer-divider {
        color: #333;
        font-size: 12px;
    }

    /* 版权文字样式 */
    .footer-copyright {
        font-size: 10px;
        letter-spacing: 0.2em;
        color: #444;
        text-transform: uppercase;
        text-align: center;
    }

    /* 响应式适配 */
    @media (max-width: 768px) {
        #footer {
            padding: 30px 20px 40px 20px;
        }
        .footer-link {
            font-size: 11px;
            letter-spacing: 0.2em;
        }
    }
</style>
