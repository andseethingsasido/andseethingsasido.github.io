<footer id="footer">

        <img src="{{ '/images/dao.png' | relative_url }}" alt="DAO" class="footer-photo">
    </div>
</footer>

<style>
    /* 1. 给页面增加底部安全距离，防止下方文字被图片遮挡 */

        body { padding-bottom: 90px !important; }
    }
    @media (min-width: 769px) {
        body { padding-bottom: 120px !important; }
    }

    /* 2. 悬浮底部容器：完全透明背景 + 穿透点击 */
    #footer {
        position: fixed;
        bottom: 0;
        left: 0;
        width: 100%;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 15px 0;
        background: transparent !important; /* 彻底去除黑色遮挡背景 */
        box-sizing: border-box;
        z-index: 9999;
        pointer-events: none; /* 让两侧透明空白区域不挡住页面点击与滑动 */
    }

    /* 3. 700px 限制容器 */
    .footer-photo-wrapper {
        width: 700px;
        max-width: 90vw;

        pointer-events: auto; /* 图片本身保留响应 */
    }

    .footer-photo {
        width: 100%;
        height: auto;
        display: block;
        object-fit: contain;
        margin: 0 auto;
        user-select: none;
        -webkit-user-drag: none;
    }
</style>
